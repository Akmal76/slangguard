services:
  api:
    build: .
    ports:
      - "8000:8000"
    # Written by the pipeline when it promotes a new model. It may not exist yet.
    env_file:
      - path: champion.env
        required: false
    volumes:
      # The model is downloaded once and kept here, so a restart starts fast.
      - hf-cache:/home/app/.cache/huggingface
    # Keeps the laptop usable if something goes wrong.
    mem_limit: 2g

  # Monitoring starts only when asked for: docker compose --profile monitoring up
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"  # only this computer can reach it
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    mem_limit: 256m

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:13.2.5
    environment:
      # Anyone on this computer can look at the dashboard. Login (admin) is still needed to edit.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    mem_limit: 384m

volumes:
  hf-cache:
  prometheus-data:
  grafana-data:
