data_dir: data/abusive
lexicon_path: data/raw/abusive/abusive.csv
output_dir: outputs/abusive
results_path: results/abusive.json
seed: 42

# The abusive data is Twitter text about hate and abuse. Without clean text from our own
# domain, the model learned that intensifiers like "banget" mean abuse, and flagged praise.
# These are clean examples from the sentiment periods (train splits for training, val splits
# for choosing C). Texts with a word of the abusive list are left out, so that a rude tweet is
# not taught as clean. Sentiment test sets are only read at the end, to report the flag rate.
clean_examples:
  periods_dir: data/periods
  periods: [p1, p2, p3, p4]
  train_per_period: 1500
  val_per_period: 300

# Letter groups inside words, not whole words: "kontol", "k0ntol" and "kntl" share many of them.
tfidf:
  analyzer: char_wb
  ngram_range: [2, 5]
  min_df: 2
  sublinear_tf: true

# C is picked on the validation set only. The test sets are scored once, at the end.
logistic_regression:
  c_grid: [0.3, 1.0, 3.0, 10.0, 30.0, 100.0]
  class_weight: balanced
  max_iter: 1000
