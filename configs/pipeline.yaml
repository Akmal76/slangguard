# Settings for the retraining pipeline (drift check, retraining, promotion).

drift:
  # A new period counts as drifted when the AUC of the old-versus-new text classifier is
  # above this value. It was set from controls on the period data (5 random samples of
  # 1,500 texts each): the same period split into train and val scored 0.48 to 0.54, and the
  # smallest real change (P2 to P3, a light slang rewrite) scored 0.65 to 0.69.
  # Real data may need another value, so repeat that check before relying on it.
  threshold: 0.60
  # The check compares at most this many texts per side, to stay fast.
  max_rows: 1500
  seed: 42

promotion:
  # A candidate must score higher than the champion on the validation set of the new period
  # by more than this much...
  min_new_gain: 0.0
  # ...and no older period may lose more than this much macro-F1 on its validation set.
  # Test sets are never used for this decision.
  max_old_drop: 0.02

mlflow:
  # The server comes from the MLFLOW_TRACKING_URI environment variable (see .env.example).
  experiment: slangguard-pipeline
  model_name: slangguard-sentiment

kaggle:
  owner: akmalramadhan
  # A private dataset with the period files, and the script kernel that trains on a GPU.
  dataset: slangguard-periods
  kernel: slangguard-update
  code_repo: https://github.com/Akmal76/slangguard.git
  # The same image as the Week 3 runs, where the torchao fix was checked.
  docker_image: gcr.io/kaggle-images/python@sha256:0717e81990be591f8c5f98f033d29ab23e9ffde057e5b3a6bd4371f93969e962
  poll_seconds: 30
  # A job that runs longer than this is treated as failed, so the GPU is not left running.
  timeout_minutes: 45

huggingface:
  # Each champion is a commit in this public repo. The Kaggle job and the API download from it.
  repo: amc76/slangguard-pipeline
