# Tiny settings to test the code on a laptop CPU in a few minutes.
# The numbers it produces mean nothing: the model is random and the data is a small slice.

model_name: hf-internal-testing/tiny-random-bert
periods_dir: data/periods
periods: [p1, p2, p3, p4]
output_dir: outputs/smoke

max_length: 64
batch_size: 8
learning_rate: 2.0e-5
weight_decay: 0.01
warmup_ratio: 0.1
epochs: 1
max_grad_norm: 1.0
seed: 42

max_rows_per_split: 50

mlflow_experiment: slangguard-smoke
