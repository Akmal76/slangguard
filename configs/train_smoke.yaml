# Tiny settings to test the code on a laptop CPU in a few minutes.
# The numbers it produces mean nothing: the model is random and the data is a small slice.

model_name: hf-internal-testing/tiny-random-bert
periods_dir: data/periods
periods: [p1, p2, p3, p4]
output_dir: outputs/smoke

max_length: 64
batch_size: 8
learning_rate: 2.0e-5
weight_decay: 0.01
warmup_ratio: 0.1
epochs: 1
max_grad_norm: 1.0
seed: 42

# LoRA (lora and lora_replay): small trainable matrices next to the attention weights.
# r is their rank, and alpha / r scales their effect. The learning rate is larger than for
# full fine-tuning because the update starts at zero. Fixed before any run.
lora:
  r: 8
  alpha: 16
  dropout: 0.1
  target_modules: [query, value]
  learning_rate: 2.0e-4

# Share of each old period's train rows kept in the replay buffer (replay methods).
replay_fraction: 0.05

max_rows_per_split: 50

mlflow_experiment: slangguard-smoke
