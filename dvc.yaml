stages:
  download:
    cmd: python -m src.data.download
    deps:
      - src/data/download.py
    params:
      - configs/data.yaml:
          - sources
    outs:
      - data/raw

  clean:
    cmd: python -m src.data.clean
    deps:
      - src/data/clean.py
      - src/data/tsv.py
      - data/raw/smsa
      - data/raw/idsa
    params:
      - configs/data.yaml:
          - malay_markers
    outs:
      - data/interim

  split:
    cmd: python -m src.data.split
    deps:
      - src/data/split.py
      - src/data/tsv.py
      - data/interim
      - data/raw/lexicon
    params:
      - configs/data.yaml:
          - seed
          - split_ratios
          - slang_rate
          - reversed_word_count
    outs:
      - data/periods

  abusive:
    cmd: python -m src.data.abusive
    deps:
      - src/data/abusive.py
      - src/data/clean.py
      - src/data/split.py
      - src/data/tsv.py
      - data/raw/abusive
    params:
      - configs/data.yaml:
          - seed
          - split_ratios
    outs:
      - data/abusive
