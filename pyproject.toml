[project]
name = "slangguard"
version = "0.1.0"
description = "Continual-learning MLOps system for Indonesian sentiment analysis"
readme = "README.md"
# Pinned to the Python minor version that Kaggle Notebooks run, where training happens.
requires-python = ">=3.13,<3.14"
dependencies = [
    "peft>=0.21.2",
    "pyyaml>=6.0.3",
    "torch>=2.11.0",
    "transformers>=5.22.2",
]

# The Docker image installs only the core dependencies plus "serve". Training and
# development tools stay out of it. Locally, uv installs all groups (see default-groups).
[dependency-groups]
train = [
    "mlflow>=3.18.0",
]
serve = [
    "fastapi>=0.115.0",
    "prometheus-client>=0.26.0",
    "uvicorn>=0.54.0",
]
# The public demo on Hugging Face Spaces. Used locally and in tests, not in the Docker image.
demo = [
    "gradio>=6.31.0",
]
# The retraining pipeline: drift check, orchestration, and the Kaggle CLI. Not in the Docker image.
pipeline = [
    "evidently>=0.7.23",
    "kaggle>=2.2.5",
    "prefect>=3.9.2",
]
dev = [
    "dvc>=3.67.1",
    "dvc-s3>=3.3.0",
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "pandas>=2.3,<3",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.uv]
default-groups = ["dev", "train", "serve", "pipeline", "demo"]

# On Linux (Docker and CI) torch comes from the CPU-only index. The default build pulls
# several GB of CUDA libraries that those machines never use. macOS is not affected.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
