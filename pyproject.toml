[project]
name = "slangguard"
version = "0.1.0"
description = "Continual-learning MLOps system for Indonesian sentiment analysis"
readme = "README.md"
# Pinned to the Python minor version that Kaggle Notebooks run, where training happens.
requires-python = ">=3.13,<3.14"
dependencies = [
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "dvc>=3.67.1",
    "dvc-s3>=3.3.0",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
